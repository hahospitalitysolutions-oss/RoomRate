# RoomRate frontend — nginx site configuration.
#
# WHAT THIS FILE IS: a `server { }` block (plus one `map`), not a top-level
# nginx.conf. The Dockerfile installs it as
# /etc/nginx/templates/default.conf.template, so the stock nginx entrypoint
# runs envsubst over it and writes /etc/nginx/conf.d/default.conf, which the
# image's own nginx.conf includes from inside `http { }`. Keeping the image's
# main nginx.conf untouched matters: in the unprivileged image it is what puts
# the pid and the temp paths somewhere a non-root user can actually write.
#
# ENVSUBST: only ${...} placeholders whose name is an exported environment
# variable are substituted, and the Dockerfile narrows that further with
# NGINX_ENVSUBST_FILTER=^ROOMRATE_ so nginx's own $uri / $host / $body_bytes_sent
# survive untouched. Every ROOMRATE_* placeholder below has an ENV default in
# the Dockerfile — an undefined one would be left as a literal "${NAME}" and
# nginx would then reject the config as an unknown variable.

# Cache-Control is computed here rather than with per-location `add_header`,
# because add_header does NOT merge across levels: a single add_header inside a
# location silently drops every security header inherited from the server
# block. One map + one server-level add_header keeps the two concerns apart.
map $uri $roomrate_cache_control {
    # Config is injected per environment and must never be cached anywhere.
    "/runtime-config.js"                                 "no-store";

    # Angular builds with outputHashing: "all", so main-XXXXXXXX.js,
    # chunk-XXXXXXXX.js and styles-XXXXXXXX.css are content-addressed: a new
    # deploy produces new filenames, so these can never go stale.
    "~^/[^/]+-[A-Z0-9]{8}\.(?:js|css)$"                  "public, max-age=31536000, immutable";

    # Unhashed assets copied from public/ (file.svg, globe.svg, window.svg).
    # Short cache with revalidation — the name is reused across deploys.
    "~^/[^/]+\.(?:svg|png|jpe?g|ico|webp|woff2?)$"        "public, max-age=3600";

    # index.html, and every SPA route that falls back to it. It names the
    # hashed bundles, so caching it is what makes a deploy invisible.
    default                                              "no-cache";
}

server {
    # 8080, not 80: the unprivileged image runs as uid 101 and cannot bind a
    # privileged port. The TLS terminator / ingress in front maps 443 to this.
    #
    # IPv4 only, deliberately. `listen [::]:8080` makes nginx refuse to start
    # ("Address family not supported by protocol") on a host whose Docker
    # network has no IPv6 — which is still the default. Add it back only for a
    # deployment known to be dual-stack.
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # --- Content-Security-Policy ------------------------------------------
    # Held in a variable only to keep the add_header line readable.
    #
    #   script-src 'self'  — the production bundle is external .js files,
    #     no exceptions. angular.json sets "inlineCritical": false, so the
    #     build never emits Angular's deferred-stylesheet trick
    #     (<link media="print" onload="this.media='all'">) that used to need
    #     an 'unsafe-hashes' hash token here plus an nginx sub_filter to strip
    #     the handler before the HTML left this server. Re-enabling
    #     inlineCritical in angular.json would silently reopen that need —
    #     check the built index.html for an inline onload before touching
    #     either config again.
    #   style-src 'unsafe-inline' — unavoidable: Angular injects every
    #     component `styles:` block as a runtime <style> element, and Mapbox
    #     GL does the same for its controls.
    #   worker-src/child-src blob: — Mapbox GL runs its parser in a worker
    #     created from a blob URL.
    #   connect-src — Mapbox tiles + telemetry, Neon Auth, and the
    #     RoomRate API. The API origin is NOT known at build time (see the
    #     runtime-config note further down), so it is injected here: set
    #     ROOMRATE_CSP_API_ORIGINS to the API's https origin AND its wss
    #     origin, e.g. "https://api.example.gr wss://api.example.gr"
    #     (notifications.service.ts opens /ws/alerts by swapping http->ws on
    #     the same base URL). Always list both schemes explicitly, even when
    #     the API is reverse-proxied onto this same origin: 'self' covers the
    #     https origin, but whether it also implicitly covers the matching
    #     wss: origin is CSP Level 3 same-origin-upgrade behaviour, not a
    #     browser support matrix worth betting on. One extra token here is
    #     cheaper than that bet.
    set $roomrate_csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.mapbox.com; font-src 'self' data:; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'self' https://api.mapbox.com https://events.mapbox.com https://*.neon.tech ${ROOMRATE_CSP_API_ORIGINS}";

    # `always` so the headers are present on error responses too.
    # No Strict-Transport-Security here on purpose: HSTS belongs to whatever
    # terminates TLS, and emitting it from a plain-HTTP backend is how a
    # staging host ends up pinned to https by accident.
    add_header Content-Security-Policy   $roomrate_csp                      always;
    add_header X-Content-Type-Options    "nosniff"                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
    add_header X-Frame-Options           "DENY"                             always;
    add_header Cross-Origin-Opener-Policy "same-origin"                     always;
    add_header Permissions-Policy        "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cache-Control             $roomrate_cache_control            always;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    # No woff2 here: it is already compressed, so gzipping it burns CPU for
    # nothing. text/html is always gzipped and cannot be listed.
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml
                      application/manifest+json;

    # --- Runtime configuration --------------------------------------------
    # HOW THE FRONTEND LEARNS ITS API URL — read this before changing anything.
    #
    # Angular never reads environment variables. index.html loads
    # /runtime-config.js, which sets window.__ROOMRATE_CONFIG__, and
    # src/environments/environment.ts reads that object at startup. So the
    # bundle is environment-agnostic: ONE image promotes from staging to
    # production unchanged, and only this response differs. (The NG_APP_*
    # variables that used to sit in .env.example are dead — nothing reads them.)
    #
    # public/runtime-config.js is baked into the image with empty strings as a
    # placeholder; this exact-match location outranks that static file and
    # serves the real values from the container's environment instead.
    #
    # Everything here is browser-readable by design. These are publishable
    # identifiers — the Supabase anon key and the public Mapbox token. Never
    # add INTERNAL_API_KEY, ROOMRATE_API_KEY or a database URL: every visitor
    # can read this response. Values are inserted verbatim into a JS string
    # literal, so they must come from the operator, never from user input — and
    # must not contain a `"` or a `$` (nginx interpolates `$name` inside the
    # `return` string). Supabase anon keys and Mapbox public tokens contain
    # neither.
    location = /runtime-config.js {
        # default_type, not add_header: it does not reset the inherited
        # security headers above.
        default_type application/javascript;
        charset      utf-8;
        return 200 'window.__ROOMRATE_CONFIG__ = { apiBaseUrl: "${ROOMRATE_API_BASE_URL}", neonAuthUrl: "${ROOMRATE_NEON_AUTH_URL}", mapboxToken: "${ROOMRATE_MAPBOX_TOKEN}" };';
    }

    # Angular client-side routing: /map, /pricing, /settings, /privacy, /terms
    # and every deep link are not files on disk. Anything that is not a real
    # file is answered with index.html and resolved by the router.
    location / {
        try_files $uri /index.html;
    }

    # Never hand a 404 page to a missing bundle — that would be served as HTML
    # under a .js name and fail confusingly. The SPA fallback above only
    # applies to routes.
    # Quoted because of the {8}: an unquoted brace in a location regex is a
    # block delimiter to nginx's config parser, not a repetition count.
    location ~ "-[A-Z0-9]{8}\.(?:js|css)$" {
        try_files $uri =404;
    }

    # Hide dotfiles (a stray .env or .map must never be published).
    location ~ /\. {
        deny all;
    }
}
