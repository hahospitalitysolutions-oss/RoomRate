name: RoomRate CI

# Both triggers are deliberate: pushes to any branch get feedback, and pull
# requests re-run against the merge commit. A branch with an open PR therefore
# runs twice; the concurrency group below still cancels superseded runs.
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No secrets are required. The backend suite passes with a completely empty
# environment (no DATABASE_URL, no APIFY_TOKEN, no Supabase keys) and the
# Playwright specs mock FastAPI and Supabase in-page; the one spec that needs a
# live backend, e2e/live-walkthrough.spec.ts, calls test.skip() at module level
# unless ROOMRATE_E2E_API_KEY and ROOMRATE_E2E_ACCOUNT_ID are set.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Tests
        run: python -m pytest api/tests -q

      - name: Alembic — exactly one migration head
        # A second head means two branches added migrations in parallel and
        # `alembic upgrade head` would fail in the deploy's migrate service.
        # `alembic heads` only reads migrations/ — it never opens a database
        # connection, so this needs no DATABASE_URL.
        run: |
          python -m alembic heads
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          heads = ScriptDirectory.from_config(Config("alembic.ini")).get_heads()
          print(f"alembic heads: {heads}")
          if len(heads) != 1:
              raise SystemExit(
                  f"expected exactly 1 Alembic head, found {len(heads)}: {heads}. "
                  "Merge them with `alembic merge` before deploying."
              )
          PY

      - name: Byte-compile api and scraper
        run: python -m compileall api scraper -q

  migrations:
    name: Migrations (PostgreSQL 16)
    runs-on: ubuntu-latest
    # A throwaway database for this job only; the password is not a secret.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roomrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/roomrate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Upgrade an empty database to head
        run: python -m alembic upgrade head

      - name: Models match the migrations (alembic check)
        # api/models is what `alembic revision --autogenerate` diffs against.
        # An index or constraint the migrations create but the models do not
        # declare would come back as a DROP in the next autogenerated
        # migration; this fails the build instead.
        run: python -m alembic check

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Angular 20.3 needs Node ^20.19 (its "engines" range excludes
          # 20.0-20.18). Pinned to the exact minor "20.19" rather than the
          # floating "20": "20" would only land on >=20.19 by accident,
          # depending on whichever 20.x build happens to be latest, whereas
          # "20.19" states the real requirement and fails the job loudly if a
          # matching build is ever unavailable — instead of silently
          # building/testing on a Node too old for this Angular version.
          node-version: "20.19"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright chromium
        # playwright.config.ts declares no `projects`, so the default chromium
        # project is the only browser the suite uses.
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        # playwright.config.ts owns the dev server: its `webServer` block runs
        # `npm run dev` and waits for http://127.0.0.1:4200, so CI must NOT
        # start ng serve itself (reuseExistingServer only reuses one if a
        # server is already listening).
        run: npx playwright test

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore
